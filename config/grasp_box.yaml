# The cube the mobile manipulator picks up, and the long table it rests on.
#
# This file is the single source of truth for the cube and for the table's
# geometry used by MoveIt's planning scene. The table itself is a static
# model named grasp_table in worlds/demo.world, so it exists before SLAM and
# Nav2 start; test_map_assets.py checks that the two descriptions agree.
#
# Poses are in the Gazebo world frame. The robot spawns at the world origin
# and the differential-drive plugin starts /odom there, so the odom frame
# coincides with the world frame at the start of a run.
#
# Note on the requested (1.0, 0, 0.25): after the requested 1.0 m drive the
# chassis centre is already at x ~= 1.0, so a cube at x = 1.0 would sit inside
# the robot. x = 1.45 leaves the cube ~0.45 m in front of panda_link0, which
# is the reach this arm was verified to hold while pointing straight down.
#
# The table is 2.0 m long (Y) and 0.6 m deep (X) so the cube can be moved
# left/centre/right along Y for lateral-grasp tests. Its top is 0.30 m above
# the floor, 5 cm above the lidar's 0.25 m scan plane: a 0.25 m top would be
# coplanar with the scan and the table would drop in and out of the map. The
# cube centre is therefore table_height + size / 2 = 0.325 m.
grasp_box:
  size: 0.05              # cube edge length [m]
  mass: 0.05              # [kg] a 5 cm plastic cube
  x: 1.45                 # initial cube centre [m], world frame
  y: 0.0                  # move it along Y for the left/centre/right tests
  z: 0.325                # table_height + size / 2
  table_x: 1.45           # table centre [m], fixed while the cube moves
  table_y: 0.0
  table_size_x: 0.60      # depth across the approach direction [m]
  table_size_y: 2.00      # long axis, used for lateral positions [m]
  table_height: 0.30      # top face height [m]
  friction: 2.0           # cube/ground contact friction coefficient

  # Grasp geometry. tcp_offset is the distance from the panda_hand frame
  # origin to the grasp point along the hand's +z axis. It has to clear the
  # palm (0.066 m deep in the hand mesh) plus half the cube, otherwise the
  # palm would press on the cube's top face.
  tcp_offset: 0.10
  approach_clearance: 0.05  # pre-grasp TCP height above the cube's top face [m]
  # Closing the fingers is done with a constant force, not a position: a
  # position command is a teleport in gazebo_ros2_control and produces no
  # steady squeeze. The prismatic finger joints have 1 N of joint friction,
  # so part of the command never reaches the cube. The earlier 7.19 cm gap
  # was not a force shortage: the position-controlled "open" had settled at
  # 0.036 m instead of 0.04 m, and the vision's centroid-depth point sat on
  # a side face, so a pad scraped the cube's top edge during the descend and
  # pushed it ~2 cm sideways. The open is now verified with the effort
  # controller, the top face is measured from the highest part of the depth
  # cloud, and the pre-close leaves only a few millimetres of press travel.
  # At that short travel 10 N seats the pads without ejecting the cube; the
  # lift itself is carried by the fixed joint that the my_robot_grasp_attach
  # plugin creates in Gazebo.
  squeeze_effort: 10.0      # [N] constant closing force per finger
  lift_height: 0.10         # [m] how far the arm lifts after attaching
  # MoveIt velocity scaling for the lift. A slow lift keeps the cube from
  # swinging while the fixed joint takes up the load.
  lift_velocity: 0.1
