# ros2_control controllers used by gazebo_ros2_control for the Panda arm.
#
# The differential drive is NOT here: the wheels are still driven by
# libgazebo_ros_diff_drive.so inside my_car.urdf. Different joints, no conflict.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Position control for opening the gripper and for the pre-close move.
    # Gazebo Classic does not implement URDF <mimic> for physics, so
    # controlling both keeps the gripper symmetric instead of leaving
    # panda_finger_joint2 free.
    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Constant-force squeeze for the grasp itself. A position command is a
    # teleport in gazebo_ros2_control: the pad lands inside the cube, the
    # contact shoves the cube away and no steady normal force exists. A
    # position-derived PID (in the JTC) oscillates far too violently for a
    # 15 g finger, so the grasp uses this open-loop effort controller instead.
    panda_hand_effort_controller:
      type: effort_controllers/JointGroupEffortController


panda_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.5

panda_hand_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      # This controller only opens the gripper and performs the pre-close;
      # the squeeze itself runs on panda_hand_effort_controller, so it never
      # needs to tolerate a cube blocking the fingers.
      # The tolerance has to satisfy two limits:
      #   * well below the pre-close travel, otherwise the controller calls
      #     the open stop "already there". With 1 cm (the old value) the open
      #     stop (0.0395 m) was within tolerance of the 0.0295 m target: the
      #     JTC declared success immediately, never moved a finger, and three
      #     resends failed the same way. The smallest travel is
      #     0.040 - 0.029 = 11 mm; 5 mm still forces at least 6 mm of motion.
      #   * above the finger's real seating error. Live at y=+0.6 m the pads
      #     stopped at (0.0321, 0.0300) against a 0.0299 m target -- 2.2 mm
      #     short, closed by the effort squeeze that follows. A 1.5 mm goal
      #     tolerance aborted that same pre-close (status=6, ABORTED) even
      #     though the pads had nearly reached the cube.
      panda_finger_joint1:
        goal: 0.005
      panda_finger_joint2:
        goal: 0.005

panda_hand_effort_controller:
  ros__parameters:
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
