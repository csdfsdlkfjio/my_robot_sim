# Generated from worlds/demo.world's exact geometry, in the Gazebo world
# frame (the robot spawns at the world origin and /odom starts there).
# The previous file was a SLAM trace whose room was rotated ~52 degrees
# against the world and contained two overlapping wall outlines; AMCL
# jumped between them during the in-place search and sent Nav2 the wrong
# way. The walls are at x/y = +/-4 and the two boxes sit at (1.5, 1.0)
# and (-1.5, -1.5), so with this map AMCL's correct initial pose is
# (0, 0, 0) -- see config/nav2_params.yaml.
image: my_map.pgm
mode: trinary
resolution: 0.05
origin: [-4.35, -4.35, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
